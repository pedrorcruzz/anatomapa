name: CI

on:
  push:
    branches: [main, homolog, develop]
  pull_request:
    branches: [main, homolog, develop]

jobs:
  test:
    name: Testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Guarda de zero dependências
        run: |
          if [ -f requirements.txt ] || [ -f apps/requirements.txt ]; then
            echo "Arquivo de requirements encontrado: a lib deve ser zero-dep (so stdlib)."
            exit 1
          fi
          echo "OK: sem arquivos de dependências."

      - name: Verificar import da lib (só stdlib)
        working-directory: apps
        run: python -c "import anatomapa; print('import OK')"

      - name: Rodar testes (unittest, stdlib)
        working-directory: apps
        run: python -m unittest discover -s tests -t . -v

      - name: Cobertura mínima 90% (stdlib trace, zero-dep)
        working-directory: apps
        run: python tools/coverage_check.py --min 90

  web:
    name: Testes do site (TypeScript + Vitest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar dependências do site
        working-directory: apps/web
        run: bun install --frozen-lockfile

      - name: Checar tipos
        working-directory: apps/web
        run: bun run type-check

      - name: Rodar testes (vitest)
        working-directory: apps/web
        run: bun run test:unit --run
