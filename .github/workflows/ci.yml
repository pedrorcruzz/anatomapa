name: CI

on:
  push:
    branches: [main, homolog, develop]
  pull_request:
    branches: [main, homolog, develop]

jobs:
  test:
    name: Testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Guarda de zero dependências
        run: |
          if [ -f requirements.txt ] || [ -f apps/requirements.txt ]; then
            echo "Arquivo de requirements encontrado: a lib deve ser zero-dep (so stdlib)."
            exit 1
          fi
          echo "OK: sem arquivos de dependências."

      - name: Verificar import da lib (só stdlib)
        working-directory: app
        run: |
          if [ -d anatomapa ]; then
            python -c "import anatomapa; print('import OK')"
          else
            echo "Pacote anatomapa ainda nao criado, pulando."
          fi

      - name: Rodar testes (unittest, stdlib)
        working-directory: app
        run: |
          if [ -d tests ]; then
            python -m unittest discover -s tests -t . -v
          else
            echo "Pasta de testes ainda nao criada, pulando."
          fi

      - name: Cobertura mínima 90% (stdlib trace, zero-dep)
        working-directory: app
        run: |
          if [ -d tests ] && [ -f tools/coverage_check.py ]; then
            python tools/coverage_check.py --min 90
          else
            echo "Sem testes ou ferramenta de cobertura, pulando."
          fi
