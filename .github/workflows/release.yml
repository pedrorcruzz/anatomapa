name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar (ex.: v0.1.0 ou v0.1.0-beta.1)"
        required: true

permissions:
  contents: write

jobs:
  verify:
    name: Verificar versão declarada
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - name: Resolver tag
        id: t
        run: |
          TAG="${{ github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.t.outputs.tag }}
      # Portão obrigatório: o Zenodo arquiva o tarball DA TAG, então pyproject,
      # __init__, CITATION.cff e .zenodo.json têm que já estar certos aqui.
      # Falhar antes de criar o release impede o webhook do Zenodo de disparar.
      - name: Conferir os 4 arquivos de versão contra a tag
        run: python3 apps/tools/bump_version.py --check "${{ steps.t.outputs.tag }}"

  release:
    name: Publicar GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      prerelease: ${{ steps.t.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolver tag e tipo
        id: t
        run: |
          TAG="${{ needs.verify.outputs.tag }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if echo "$TAG" | grep -qiE '\-(beta|rc)'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Gerar notas do release
        id: notes
        run: |
          TAG="${{ steps.t.outputs.tag }}"
          PREV=$(git tag -l 'v*' --sort=-v:refname | grep -v "^${TAG}$" | head -1)
          if [ -n "$PREV" ]; then RANGE="${PREV}..${TAG}"; else RANGE="${TAG}"; fi
          LIST=$(git log --no-merges --pretty=format:"- %s" "$RANGE" 2>/dev/null | grep -viE '^- Merge|promov' || true)
          [ -z "$LIST" ] && LIST="Release ${TAG}"
          {
            echo "body<<CHANGELOG_EOF"
            echo "$LIST"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.t.outputs.tag }}
          name: ${{ steps.t.outputs.tag }}
          body: ${{ steps.notes.outputs.body }}
          prerelease: ${{ steps.t.outputs.prerelease }}

  build:
    name: Construir o pacote (sdist + wheel)
    needs: release
    if: needs.release.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # A versão vem commitada na tag, não é mais reescrita aqui: o job verify
      # garantiu que ela bate. Este passo só deixa o valor visível no log.
      - name: Mostrar a versão do pacote
        run: grep -E '^version|^__version__' pyproject.toml apps/anatomapa/__init__.py
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Guardar artefatos
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publicar no PyPI (tag estável)
    needs: [release, build]
    if: needs.release.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/anatomapa
    permissions:
      id-token: write
    steps:
      - name: Baixar artefatos
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publicar no PyPI (Trusted Publishing, sem token)
        uses: pypa/gh-action-pypi-publish@release/v1
