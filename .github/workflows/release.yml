name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar (ex.: v0.1.0 ou v0.1.0-beta.1)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Publicar GitHub Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      prerelease: ${{ steps.t.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolver tag e tipo
        id: t
        run: |
          TAG="${{ github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if echo "$TAG" | grep -qiE '\-(beta|rc)'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Gerar notas do release
        id: notes
        run: |
          TAG="${{ steps.t.outputs.tag }}"
          PREV=$(git tag -l 'v*' --sort=-v:refname | grep -v "^${TAG}$" | head -1)
          if [ -n "$PREV" ]; then RANGE="${PREV}..${TAG}"; else RANGE="${TAG}"; fi
          LIST=$(git log --no-merges --pretty=format:"- %s" "$RANGE" 2>/dev/null | grep -viE '^- Merge|promov' || true)
          [ -z "$LIST" ] && LIST="Release ${TAG}"
          {
            echo "body<<CHANGELOG_EOF"
            echo "$LIST"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.t.outputs.tag }}
          name: ${{ steps.t.outputs.tag }}
          body: ${{ steps.notes.outputs.body }}
          prerelease: ${{ steps.t.outputs.prerelease }}

  build:
    name: Construir o pacote (sdist + wheel)
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Guardar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publicar no PyPI (tag estável)
    needs: [release, build]
    if: needs.release.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Baixar artefatos
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publicar no PyPI (Trusted Publishing, sem token)
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    name: Publicar no TestPyPI (tag beta/rc)
    needs: [release, build]
    if: needs.release.outputs.prerelease == 'true'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Baixar artefatos
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publicar no TestPyPI (Trusted Publishing, sem token)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
