[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "anatomapa"
version = "0.1.0"
description = "Biblioteca Python para mapas de calor anatômicos da superfície do corpo humano. Zero dependências."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Pedro Rosa" },
  { name = "Marcelo Reis" },
  { name = "Mozart Melo" },
]
keywords = ["anatomia", "heatmap", "mapa de calor", "svg", "visualizacao", "epidemiologia"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/pedrorcruzz/anatomapa"
Repository = "https://github.com/pedrorcruzz/anatomapa"

[tool.setuptools.packages.find]
where = ["app"]
include = ["anatomapa*"]

# Empacota os assets do modelo (SVGs + regions.json + atribuição) dentro do wheel.
# Sem isto, a lib instalada não encontra o corpo e heatmap() quebra.
[tool.setuptools.package-data]
anatomapa = ["assets/*.svg", "assets/*.json", "assets/*.txt"]
