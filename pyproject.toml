[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "anatomapa"
version = "0.3.8"
description = "Python library for anatomical heatmaps of the human body surface. Zero dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Pedro Rosa" },
  { name = "Marcelo Reis" },
  { name = "Mozart Melo" },
]
keywords = ["anatomy", "heatmap", "body map", "svg", "visualization", "epidemiology", "anatomia", "mapa de calor"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = []

# Extra opcional para saída raster (png/jpg/jpeg). O núcleo segue zero-dep;
# estes pacotes só são importados quando um formato raster é solicitado.
[project.optional-dependencies]
raster = ["cairosvg>=2.5", "Pillow>=9"]

[project.urls]
Homepage = "https://github.com/pedrorcruzz/anatomapa"
Repository = "https://github.com/pedrorcruzz/anatomapa"

[tool.setuptools.packages.find]
where = ["app"]
include = ["anatomapa*"]

# Empacota os assets do modelo (SVGs + regions.json + atribuição) dentro do wheel.
# Sem isto, a lib instalada não encontra o corpo e heatmap() quebra.
# O py.typed (PEP 561) é o que faz o type checker enxergar as anotações da lib
# instalada; sem ele, os overloads de heatmap() são ignorados no projeto de quem usa.
[tool.setuptools.package-data]
anatomapa = ["assets/*.svg", "assets/*.json", "assets/*.txt", "py.typed"]
